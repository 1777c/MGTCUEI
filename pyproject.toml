[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mgtcuei"
version = "1.0.0"
description = "MGTCUEI：使用受控上层证据注入器预测药物–疾病关联"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "transformers>=4.40",
    "tokenizers>=0.19",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
